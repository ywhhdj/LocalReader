plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { stream ->
        localProperties.load(stream)
    }
}

def storePass = localProperties.getProperty('KEYSTORE_PASSWORD')
        ?: System.getenv('KEYSTORE_PASSWORD')
def aliasName = localProperties.getProperty('KEY_ALIAS')
        ?: System.getenv('KEY_ALIAS')
def keyPass = localProperties.getProperty('KEY_PASSWORD')
        ?: System.getenv('KEY_PASSWORD')

android {
    namespace 'com.demo'
    compileSdk 34

    defaultConfig {
        applicationId "com.localReader.demo"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1.1"
    }
    def keystoreFile = rootProject.file('../keystore/release.jks')
    def hasReleaseSigning = keystoreFile.exists() && storePass && aliasName && keyPass

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile keystoreFile
                storePassword storePass
                keyAlias aliasName
                keyPassword keyPass
            }
        }
    }
    

     buildTypes {

        release {
            ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles(
                getDefaultProguardFile('proguard-android-optimize.txt'),
                'proguard-rules.pro'
            )
            crunchPngs = true
        }
    }

    buildFeatures {
        compose true
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2024.09.03')

    implementation composeBom

    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'
    implementation 'androidx.navigation:navigation-compose:2.8.4'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.1'
    implementation 'androidx.datastore:datastore-preferences:1.1.1'

    implementation 'io.coil-kt:coil-compose:2.6.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation "org.jsoup:jsoup:1.17.2"
    implementation "com.github.junrar:junrar:7.5.10"

    def roomVersion = "2.6.1"
    
    implementation "androidx.room:room-runtime:$roomVersion"
    implementation "androidx.room:room-ktx:$roomVersion"
    ksp "androidx.room:room-compiler:$roomVersion"

}
